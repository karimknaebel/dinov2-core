[project]
name = "dinov2-core"
version = "0.1.0"
description = "Minimal DINOv2 backbones for downstream fine-tuning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "numpy>=1.24",
    "pillow>=10",
    "pytest>=8",
]

[tool.pytest.ini_options]
markers = [
    "cuda: requires a CUDA device",
    "upstream: compares against facebookresearch/dinov2 through torch.hub",
    "pretrained: downloads pretrained checkpoints",
]
